[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlayer"
version = "0.1.0"
description = "CLI para adicionar camadas OCR a PDFs escaneados com OCRmyPDF."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ocr", "pdf", "ocrmypdf", "cli", "portuguese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "ocrmypdf>=16.10,<17",
    "typer[all]>=0.12,<1",
    "rich>=13,<15",
    "pypdf>=5,<7",
]

[project.scripts]
scanlayer = "scanlayer.cli:app"

[project.optional-dependencies]
dev = [
    "Pillow>=10.1,<13",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "mypy>=1.11,<2",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanlayer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = ["integration: executa OCR real com Tesseract e Ghostscript (--run-ocr)"]

[tool.coverage.run]
source = ["scanlayer"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ANN", "ARG", "BLE", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
